# Container mount -> local path, plus the dev Navidrome endpoint. Only
# deployment-specific settings belong here; tests/test_homelab_config_parity.py
# fails on any other key.
#   /config     -> .config
#   /music      -> .library
#   /downloads  -> .inbox
#   Navidrome   -> the throwaway test container that
#                  .scratch/navidrome-safe-lifecycle/repro/e2e_webimport.py
#                  starts (dummy credentials; not your real server)
directory: /Users/evansmith/repos/beets-web-import/.library
library: /Users/evansmith/repos/beets-web-import/.config/library.db

import:
  log: /Users/evansmith/repos/beets-web-import/.config/beet.log

webimport:
  inbox_dir: /Users/evansmith/repos/beets-web-import/.inbox
  navidrome:
    url: http://localhost:14534
    user: webimport
    password: password
