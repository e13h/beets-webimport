# Dev config: the homelab config, with only the deployment paths overridden.
#
#   homelab.yaml  verbatim copy of selfhosted/services/reptile/beets/config-beets/config.yaml
#   local.yaml    path overrides for this machine (container mount -> repo dir)
#
# beets applies `include:` files on top of this file, in order, so local.yaml
# wins over homelab.yaml. Change behavior in homelab.yaml (then copy it to the
# homelab), never here or in local.yaml. tests/test_homelab_config_parity.py
# enforces both rules.
include:
  - homelab.yaml
  - local.yaml
